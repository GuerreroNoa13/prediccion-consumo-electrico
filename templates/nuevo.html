{% extends "base.html" %}

{% block contenido %}
<header class="encabezado">
  <p class="sobretitulo">Paso 05</p>
  <h1>Ingresar un hogar nuevo</h1>
  <div class="escala"></div>
</header>

<p>Escribe los datos del hogar. El modelo estimará cuántos kWh consumirá en un mes.</p>

{% if error %}
<p class="aviso error">{{ error }}</p>
{% endif %}

<form method="post" action="{{ url_for('predecir') }}">
  <div class="campos">
    <label>
      <span>Personas</span>
      <input type="number" name="personas" step="1" min="0" value="{{ valores.personas }}" required>
    </label>
    <label>
      <span>Dispositivos electrónicos</span>
      <input type="number" name="dispositivos" step="1" min="0" value="{{ valores.dispositivos }}" required>
    </label>
    <label>
      <span>Horas de A/C por día</span>
      <input type="number" name="horas" step="0.1" min="0" max="24" value="{{ valores.horas }}" required>
    </label>
    <label>
      <span>Temperatura (°C)</span>
      <input type="number" name="temperatura" step="0.1" value="{{ valores.temperatura }}" required>
    </label>
  </div>
  <button class="boton" type="submit">Predecir consumo</button>
</form>
{% endblock %}
